services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: retrieval_search
      POSTGRES_USER: retrieval
      POSTGRES_PASSWORD: retrieval
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retrieval -d retrieval_search"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  # One-shot job: pulls the model into the ollama service above via its API, retrying on
  # transient network failures (e.g. registry EOF) instead of taking the server down.
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "until ollama pull llama3.2:3b; do echo 'pull failed, retrying in 5s...'; sleep 5; done"]

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: retrieval_search
      DB_USER: retrieval
      DB_PASSWORD: retrieval
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2:3b
    ports:
      - "8080:8080"

volumes:
  pgdata:
  ollama_data:
